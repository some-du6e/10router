name: Security (local host)

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "cli/cli.js"
      - "cli/scripts/build-cli.js"
      - "cli/src/cli/api/client.js"
      - "cli/src/cli/terminalUI.js"
      - "open-sse/handlers/ttsProviders/localDevice.js"
      - "src/lib/appUpdater.js"
      - "src/lib/mcp/**"
      - "tests/unit/app-updater-kill-sweep.test.js"
      - "tests/unit/local-device-tts-args.test.js"
      - "tests/unit/mcp-bridge-child-env.test.js"
      - "tests/unit/cli-local-host-hardening.test.js"
      - ".github/workflows/security-local-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        working-directory: tests
        run: >
          ./node_modules/.bin/vitest run
          unit/app-updater-kill-sweep.test.js
          unit/local-device-tts-args.test.js
          unit/mcp-bridge-child-env.test.js
          unit/cli-local-host-hardening.test.js
      - name: Full suite against baseline
        working-directory: tests
        run: |
          ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/results.json" > /dev/null || true
          node __baseline__/verify-no-regression.mjs "$RUNNER_TEMP/results.json"
