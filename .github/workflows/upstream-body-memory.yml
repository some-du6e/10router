name: Upstream body memory

on:
  pull_request:
    paths:
      - "open-sse/utils/proxyFetch.js"
      - "open-sse/executors/base.js"
      - "tests/package.json"
      - "tests/vitest.config.js"
      - "tests/vitest.shared.js"
      - "tests/unit/upstream-body-memory.test.js"
      - "tests/unit/proxy-fetch-*.test.js"
      - "tests/unit/provider-fetch.test.js"
      - "tests/unit/base-executor-retry.test.js"
      - "Dockerfile"
      - ".github/workflows/upstream-body-memory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is what production runs; its bundled undici differs from 24's.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Unit tests
        working-directory: tests
        run: >
          ./node_modules/.bin/vitest run
          unit/upstream-body-memory.test.js
          unit/proxy-fetch-headers-timeout.test.js
          unit/proxy-fetch-error-redaction.test.js
          unit/base-executor-retry.test.js
          unit/provider-fetch.test.js
      - name: Lint
        run: >
          ./node_modules/.bin/eslint
          open-sse/utils/proxyFetch.js
          tests/unit/upstream-body-memory.test.js
          tests/unit/provider-fetch.test.js

  # Informational, for the PR's "Before": this branch's memory tests against the
  # base branch's proxyFetch.js. Reports how many fail; it never fails the run.
  before-on-base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Check out the base branch's proxyFetch.js
        run: git checkout "origin/${{ github.base_ref || 'master' }}" -- open-sse/utils/proxyFetch.js
      - name: Run this branch's memory tests on it (informational)
        working-directory: tests
        run: |
          ./node_modules/.bin/vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/before.json" \
            unit/upstream-body-memory.test.js || true
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const r = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/before.json", "utf8"));
            const lines = [`Informational. Before on Node ${process.versions.node} (base proxyFetch.js, this branch tests): ${r.numFailedTests} failed, ${r.numPassedTests} passed of ${r.numTotalTests}`];
            for (const f of r.testResults) {
              const rel = f.name.slice(f.name.indexOf("/tests/") + 1);
              if (!f.assertionResults.length && f.status === "failed") lines.push(`  ${rel}: failed to load`);
              for (const a of f.assertionResults) {
                if (a.status !== "failed") continue;
                lines.push(`  ${rel} :: ${a.fullName}`);
                const why = (a.failureMessages?.[0] || "").split("\n")[0];
                if (why) lines.push(`      ${why}`);
              }
            }
            console.log(lines.join("\n"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "```\n" + lines.join("\n") + "\n```\n");
          '

  # The suite is not all-green on master (see AGENTS.md), so this runs it on
  # both the base and this branch and fails only on tests that pass on the base
  # and fail here.
  no-new-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Check out the base branch next to this one
        run: git worktree add ../base "origin/${{ github.base_ref || 'master' }}"
      - name: Install dependencies (branch and base)
        run: |
          for dir in . ../base; do
            (cd "$dir" && bun install --ignore-scripts && cd tests && bun install --ignore-scripts)
          done
      - name: Run the suite on the base
        working-directory: ../base/tests
        # Each run gets its own HOME: tests without a DATA_DIR use ~/.9router,
        # and one run's database must not leak into the other.
        run: |
          mkdir -p "$RUNNER_TEMP/home-base"
          HOME="$RUNNER_TEMP/home-base" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/base.json" > /dev/null 2>&1 || true
      - name: Run the suite on this branch
        working-directory: tests
        run: |
          mkdir -p "$RUNNER_TEMP/home-head"
          HOME="$RUNNER_TEMP/home-head" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/head.json" > /dev/null 2>&1 || true
      - name: Compare
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const load = (file, root) => {
              const r = JSON.parse(readFileSync(file, "utf8"));
              const status = new Map();
              for (const f of r.testResults) {
                const rel = f.name.slice(f.name.indexOf("/tests/") + 1);
                for (const a of f.assertionResults) status.set(`${rel} :: ${a.fullName}`, a.status);
                // A file that failed to load has no assertions; count it as one failure.
                if (!f.assertionResults.length && f.status === "failed") status.set(`${rel} :: (file failed to load)`, "failed");
              }
              return { status, total: r.numTotalTests, failed: r.numFailedTests };
            };
            const base = load(process.env.RUNNER_TEMP + "/base.json");
            const head = load(process.env.RUNNER_TEMP + "/head.json");
            console.log(`base: ${base.failed}/${base.total} failed, head: ${head.failed}/${head.total} failed`);
            const regressions = [...head.status].filter(([k, s]) => s === "failed" && base.status.get(k) === "passed").map(([k]) => k);
            const fixed = [...base.status].filter(([k, s]) => s === "failed" && head.status.get(k) === "passed").map(([k]) => k);
            const newFailing = [...head.status].filter(([k, s]) => s === "failed" && !base.status.has(k)).map(([k]) => k);
            if (fixed.length) console.log("Now passing:\n  " + fixed.join("\n  "));
            if (newFailing.length) console.log("New tests failing:\n  " + newFailing.join("\n  "));
            if (regressions.length) console.log("Passed on the base, fail here:\n  " + regressions.join("\n  "));
            if (regressions.length || newFailing.length) process.exit(1);
          '
