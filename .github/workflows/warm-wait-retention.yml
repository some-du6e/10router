name: Warm-wait retention

on:
  pull_request:
    paths:
      - "src/sse/handlers/chat.ts"
      - "src/proxy.js"
      - "src/lib/proxyBodyCopy.ts"
      - "src/sse/services/auth.js"
      - "src/sse/services/memoryAdmission.js"
      - "open-sse/handlers/chatCore.js"
      - "open-sse/executors/base.js"
      - "open-sse/services/cacheAffinity.js"
      - "src/lib/db/repos/requestDetailsRepo.js"
      - "tests/unit/warm-wait-release.test.js"
      - "tests/unit/proxy-body-copy.test.js"
      - "tests/unit/account-loop-attempt-cache.test.js"
      - "tests/bench/warm-wait-retention-benchmark.test.js"
      - "tests/helpers/claudeCodeBody.js"
      - "tests/helpers/heldStreams.js"
      - "tests/helpers/warmWait.js"
      # The proxy fix depends on how Next clones a body; no lockfile pins it.
      - "package.json"
      - "tests/package.json"
      - "tests/vitest.config.js"
      - "tests/vitest.benchmark.config.js"
      - "tests/vitest.shared.js"
      - ".github/e2e/warm-wait/**"
      - ".github/workflows/warm-wait-retention.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is what production runs.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Unit tests
        working-directory: tests
        run: >
          ./node_modules/.bin/vitest run
          unit/warm-wait-release.test.js
          unit/proxy-body-copy.test.js
          unit/account-loop-attempt-cache.test.js
          unit/attempt-reuse.test.js
          unit/cache-affinity.test.js
      - name: Lint
        run: >
          ./node_modules/.bin/eslint
          src/sse/handlers/chat.ts
          src/proxy.js
          src/lib/proxyBodyCopy.ts
          tests/unit/warm-wait-release.test.js
          tests/unit/proxy-body-copy.test.js
          tests/bench/warm-wait-retention-benchmark.test.js
          tests/helpers/warmWait.js
          .github/e2e/warm-wait

  # Informational, for the PR's "Before" and "After": what each request keeps
  # while it waits for a warm key, on this branch and with the base branch's
  # source files. In-process, so without Next's own copy (see e2e).
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: This branch
        working-directory: tests
        shell: bash
        # bash runs with -eo pipefail, so a crashed bench fails the step.
        run: ./node_modules/.bin/vitest run --config vitest.benchmark.config.js bench/warm-wait-retention-benchmark.test.js 2>&1 | tee "$RUNNER_TEMP/after.txt"
      - name: The base branch's source files
        run: git checkout "origin/${{ github.base_ref || 'master' }}" -- open-sse src
      - name: Base
        working-directory: tests
        shell: bash
        run: ./node_modules/.bin/vitest run --config vitest.benchmark.config.js bench/warm-wait-retention-benchmark.test.js 2>&1 | tee "$RUNNER_TEMP/before.txt"
      - name: Summary
        run: |
          {
            echo '```'
            echo "Before (base source files):"
            sed -n '/waiting, body/,/^$/p' "$RUNNER_TEMP/before.txt"
            echo "After (this branch):"
            sed -n '/waiting, body/,/^$/p' "$RUNNER_TEMP/after.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The production build and entry point (custom-server.js), measured from
  # inside the server: this is where Next's proxy copy of each body shows.
  # Both legs fail on wrong behavior (a request not answered, sent to the cold
  # key, or resumed with other bytes); the pr leg also when the waiting
  # requests still hold their bodies outside the heap.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [base, pr]
    steps:
      - name: Check out the harness
        uses: actions/checkout@v5
        with:
          path: harness
      - name: Check out the app (${{ matrix.leg }})
        uses: actions/checkout@v5
        with:
          path: app
          ref: ${{ matrix.leg == 'base' && (github.event.pull_request.base.sha || 'master') || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: app
        run: bun install --ignore-scripts
      - name: Build
        working-directory: app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: E2E (${{ matrix.leg }})
        working-directory: app
        env:
          OUT_DIR: ${{ github.workspace }}/e2e-out
        run: |
          set -o pipefail
          bash ../harness/.github/e2e/warm-wait/run.sh ${{ matrix.leg }} 2>&1 | tee ../e2e-${{ matrix.leg }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warm-wait-e2e-${{ matrix.leg }}
          path: |
            e2e-out/result-*.json
            e2e-out/server.log
            e2e-out/mock.log
            e2e-${{ matrix.leg }}.txt

  e2e-summary:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: warm-wait-e2e-*
          merge-multiple: true
      - name: Summary
        run: |
          {
            echo '```'
            for leg in base pr; do
              echo "${leg}:"
              grep -E 'waiting, body|per waiting request|waits ' "e2e-${leg}.txt" || echo "(no result)"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The suite is not all-green on master (see AGENTS.md), so this runs it on
  # both the base and this branch and fails only on tests that pass on the base
  # and fail here.
  no-new-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Check out the base branch next to this one
        run: git worktree add ../base "origin/${{ github.base_ref || 'master' }}"
      - name: Install dependencies (branch and base)
        run: |
          for dir in . ../base; do
            (cd "$dir" && bun install --ignore-scripts && cd tests && bun install --ignore-scripts)
          done
      - name: Run the suite on the base
        working-directory: ../base/tests
        # Each run gets its own HOME: tests without a DATA_DIR use ~/.9router,
        # and one run's database must not leak into the other.
        run: |
          mkdir -p "$RUNNER_TEMP/home-base"
          HOME="$RUNNER_TEMP/home-base" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/base.json" > /dev/null 2>&1 || true
      - name: Run the suite on this branch
        working-directory: tests
        run: |
          mkdir -p "$RUNNER_TEMP/home-head"
          HOME="$RUNNER_TEMP/home-head" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/head.json" > /dev/null 2>&1 || true
      - name: Compare
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const load = (file) => {
              const r = JSON.parse(readFileSync(file, "utf8"));
              const status = new Map();
              for (const f of r.testResults) {
                const rel = f.name.slice(f.name.indexOf("/tests/") + 1);
                for (const a of f.assertionResults) status.set(`${rel} :: ${a.fullName}`, a.status);
                // A file that failed to load has no assertions; count it as one failure.
                if (!f.assertionResults.length && f.status === "failed") status.set(`${rel} :: (file failed to load)`, "failed");
              }
              return { status, total: r.numTotalTests, failed: r.numFailedTests };
            };
            const base = load(process.env.RUNNER_TEMP + "/base.json");
            const head = load(process.env.RUNNER_TEMP + "/head.json");
            console.log(`base: ${base.failed}/${base.total} failed, head: ${head.failed}/${head.total} failed`);
            const regressions = [...head.status].filter(([k, s]) => s === "failed" && base.status.get(k) === "passed").map(([k]) => k);
            const fixed = [...base.status].filter(([k, s]) => s === "failed" && head.status.get(k) === "passed").map(([k]) => k);
            const newFailing = [...head.status].filter(([k, s]) => s === "failed" && !base.status.has(k)).map(([k]) => k);
            if (fixed.length) console.log("Now passing:\n  " + fixed.join("\n  "));
            if (newFailing.length) console.log("New tests failing:\n  " + newFailing.join("\n  "));
            if (regressions.length) console.log("Passed on the base, fail here:\n  " + regressions.join("\n  "));
            if (regressions.length || newFailing.length) process.exit(1);
          '
