name: Gateway token refresh

on:
  pull_request:
    paths:
      # updateProviderCredentials and the metadata patch it writes
      - "src/sse/services/tokenRefresh.js"
      - "src/lib/db/repos/connectionsRepo.js"
      # Refresh results and how the cores apply them in memory
      - "open-sse/services/oauthCredentialManager.js"
      - "open-sse/services/tokenRefresh.js"
      - "open-sse/services/tokenRefresh/providers.js"
      - "open-sse/services/tokenRefresh/dedup.js"
      - "open-sse/utils/tokenExpiry.js"
      - "open-sse/executors/github.js"
      - "open-sse/executors/antigravity.js"
      - "open-sse/executors/gemini-cli.js"
      - "open-sse/services/kiroModels.js"
      - "src/lib/oauth/kiroExternalIdp.js"
      - "open-sse/handlers/chatCore.js"
      - "open-sse/handlers/embeddingsCore.js"
      - "open-sse/handlers/imageGenerationCore.js"
      - "open-sse/handlers/videoCore.js"
      # Callers of updateProviderCredentials
      - "src/sse/handlers/imageGeneration.js"
      - "src/sse/handlers/search.js"
      - "src/sse/handlers/fetch.js"
      - "src/sse/handlers/videoGeneration.js"
      - "src/sse/handlers/embeddings.js"
      - "src/sse/handlers/chat.ts"
      - "src/sse/services/codexPooledUsage.js"
      - "src/app/api/v1/models/route.js"
      - "src/app/api/providers/*/models/route.js"
      - "src/app/api/providers/*/test/testUtils.js"
      - "src/app/api/usage/*/route.js"
      - "src/app/api/translator/send/route.js"
      - "tests/package.json"
      - "tests/vitest.config.js"
      - "tests/vitest.shared.js"
      - "tests/unit/gateway-refresh-persistence.test.js"
      - "tests/unit/refresh-metadata-patch.test.js"
      - "tests/unit/kiro-external-idp.test.js"
      - "tests/unit/codex-stale-refresh.test.js"
      - "tests/unit/refresh-retry-credentials.test.js"
      - "tests/unit/token-refresh-generic.test.js"
      - "tests/unit/background-token-refresh.test.js"
      - "tests/unit/xai-video-handler.test.js"
      - "tests/unit/xai-video-core.test.js"
      - "tests/unit/image-generation.test.js"
      - ".github/workflows/gateway-refresh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Unit tests
        working-directory: tests
        run: >
          ./node_modules/.bin/vitest run
          unit/gateway-refresh-persistence.test.js
          unit/refresh-metadata-patch.test.js
          unit/kiro-external-idp.test.js
          unit/codex-stale-refresh.test.js
          unit/refresh-retry-credentials.test.js
          unit/token-refresh-generic.test.js
          unit/background-token-refresh.test.js
          unit/xai-video-handler.test.js
          unit/xai-video-core.test.js
          unit/image-generation.test.js
      - name: Lint
        run: >
          ./node_modules/.bin/eslint
          src/sse/services/tokenRefresh.js
          src/lib/db/repos/connectionsRepo.js
          open-sse/services/oauthCredentialManager.js
          open-sse/services/kiroModels.js
          src/lib/oauth/kiroExternalIdp.js
          open-sse/handlers/chatCore.js
          open-sse/handlers/embeddingsCore.js
          open-sse/handlers/imageGenerationCore.js
          open-sse/handlers/videoCore.js
          src/sse/handlers/imageGeneration.js
          src/sse/handlers/search.js
          src/sse/handlers/fetch.js
          src/sse/handlers/videoGeneration.js
          src/sse/handlers/embeddings.js
          src/sse/handlers/chat.ts
          src/sse/services/codexPooledUsage.js
          src/app/api/v1/models/route.js
          "src/app/api/providers/[id]/models/route.js"
          "src/app/api/providers/[id]/test/testUtils.js"
          "src/app/api/usage/[connectionId]/route.js"
          src/app/api/translator/send/route.js
          open-sse/utils/tokenExpiry.js
          open-sse/executors/github.js
          open-sse/executors/antigravity.js
          open-sse/executors/gemini-cli.js
          tests/unit/gateway-refresh-persistence.test.js
          tests/unit/refresh-metadata-patch.test.js
          tests/unit/kiro-external-idp.test.js
          tests/unit/codex-stale-refresh.test.js
          tests/unit/refresh-retry-credentials.test.js

  # The suite is not all-green on master (see AGENTS.md), so this runs it on
  # both the base and this branch and fails only on tests that pass on the base
  # and fail here.
  no-new-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Check out the base branch next to this one
        run: git worktree add ../base "origin/${{ github.base_ref || 'master' }}"
      - name: Install dependencies (branch and base)
        run: |
          for dir in . ../base; do
            (cd "$dir" && bun install --ignore-scripts && cd tests && bun install --ignore-scripts)
          done
      - name: Run the suite on the base
        working-directory: ../base/tests
        # Each run gets its own HOME: tests without a DATA_DIR use ~/.9router,
        # and one run's database must not leak into the other.
        run: |
          mkdir -p "$RUNNER_TEMP/home-base"
          HOME="$RUNNER_TEMP/home-base" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/base.json" > /dev/null 2>&1 || true
      - name: Run the suite on this branch
        working-directory: tests
        run: |
          mkdir -p "$RUNNER_TEMP/home-head"
          HOME="$RUNNER_TEMP/home-head" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/head.json" > /dev/null 2>&1 || true
      - name: Compare
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const load = (file, root) => {
              const r = JSON.parse(readFileSync(file, "utf8"));
              const status = new Map();
              for (const f of r.testResults) {
                const rel = f.name.slice(f.name.indexOf("/tests/") + 1);
                for (const a of f.assertionResults) status.set(`${rel} :: ${a.fullName}`, a.status);
                // A file that failed to load has no assertions; count it as one failure.
                if (!f.assertionResults.length && f.status === "failed") status.set(`${rel} :: (file failed to load)`, "failed");
              }
              return { status, total: r.numTotalTests, failed: r.numFailedTests };
            };
            const base = load(process.env.RUNNER_TEMP + "/base.json");
            const head = load(process.env.RUNNER_TEMP + "/head.json");
            console.log(`base: ${base.failed}/${base.total} failed, head: ${head.failed}/${head.total} failed`);
            const regressions = [...head.status].filter(([k, s]) => s === "failed" && base.status.get(k) === "passed").map(([k]) => k);
            const fixed = [...base.status].filter(([k, s]) => s === "failed" && head.status.get(k) === "passed").map(([k]) => k);
            const newFailing = [...head.status].filter(([k, s]) => s === "failed" && !base.status.has(k)).map(([k]) => k);
            if (fixed.length) console.log("Now passing:\n  " + fixed.join("\n  "));
            if (newFailing.length) console.log("New tests failing:\n  " + newFailing.join("\n  "));
            if (regressions.length) console.log("Passed on the base, fail here:\n  " + regressions.join("\n  "));
            if (regressions.length || newFailing.length) process.exit(1);
          '
