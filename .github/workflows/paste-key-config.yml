name: Paste config into Add key

on:
  pull_request:
    paths:
      - "src/shared/utils/parsePastedKeyConfig.js"
      - "src/shared/utils/endpointUrl.js"
      - "src/shared/utils/connectionBaseUrl.ts"
      - "src/app/(dashboard)/dashboard/providers/*/AddApiKeyModal.js"
      - "tests/unit/parse-pasted-key-config.test.js"
      - "tests/unit/compatible-multi-endpoint.test.js"
      - ".github/workflows/paste-key-config.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Unit test
        working-directory: tests
        run: ./node_modules/.bin/vitest run unit/parse-pasted-key-config.test.js unit/compatible-multi-endpoint.test.js
      - name: Lint
        run: >
          ./node_modules/.bin/eslint
          src/shared/utils/parsePastedKeyConfig.js
          src/shared/utils/endpointUrl.js
          src/shared/utils/connectionBaseUrl.ts
          "src/app/(dashboard)/dashboard/providers/[id]/AddApiKeyModal.js"
          tests/unit/parse-pasted-key-config.test.js
      # Fails only on errors in the changed .ts file, so unrelated type errors
      # elsewhere don't block it.
      - name: Type check connectionBaseUrl.ts
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit -p . > tsc.log 2>&1
          code=$?
          set -e
          tail -5 tsc.log
          if [ "$code" -gt 2 ] || ! [ -x ./node_modules/.bin/tsc ]; then echo "tsc did not run (exit $code)"; exit 1; fi
          if grep -F "src/shared/utils/connectionBaseUrl.ts" tsc.log; then exit 1; fi
