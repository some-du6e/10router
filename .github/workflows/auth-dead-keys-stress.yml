name: Dead-key stress

# Replays the dead-key routing scenarios (tests/unit/auto-disable-stress.test.js)
# on this branch, pinned, and checks no key goes off sooner than on master's auth
# code, run in the same job (auto-disable-compare-stress.test.js). A manual run
# also replays the pinned scenarios on master's auth code for comparison.
on:
  pull_request:
    paths:
      - "src/sse/**"
      - "src/lib/**"
      - "src/shared/**"
      - "open-sse/**"
      - "tests/unit/auto-disable-stress.test.js"
      - "tests/unit/auto-disable-stress.pinned.json"
      - "tests/unit/auth-soft-demote.test.js"
      - "tests/unit/auto-disable-compare-stress.test.js"
      - "tests/unit/auto-disable-dead-keys.test.js"
      - "tests/vitest.stress.config.js"
      - "tests/vitest.shared.js"
      - "tests/package.json"
      - ".github/workflows/auth-dead-keys-stress.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Stress, this branch (pinned)
        working-directory: tests
        env:
          STRESS_PIN: "1"
          STRESS_OUT: ${{ runner.temp }}/stress-branch.json
        run: ./node_modules/.bin/vitest run --config ./vitest.stress.config.js unit/auto-disable-stress.test.js
      - name: Soft demotion and dead-key tests
        if: always()
        working-directory: tests
        run: ./node_modules/.bin/vitest run unit/auth-soft-demote.test.js unit/auto-disable-dead-keys.test.js
      # The same scenarios on master's auth code, then here: no key off sooner
      # than there, or where master keeps it on.
      - name: Turn-offs against master's auth code
        if: always()
        run: |
          git checkout origin/master -- src open-sse
          (cd tests && COMPARE_OUT="$RUNNER_TEMP/compare-master.json" ./node_modules/.bin/vitest run --config ./vitest.stress.config.js unit/auto-disable-compare-stress.test.js)
          git checkout HEAD -- src open-sse
          cd tests && COMPARE_MASTER="$RUNNER_TEMP/compare-master.json" COMPARE_OUT="$RUNNER_TEMP/compare-branch.json" ./node_modules/.bin/vitest run --config ./vitest.stress.config.js unit/auto-disable-compare-stress.test.js
      # For comparison only, on a manual run: master's numbers never fail the job.
      - name: Stress, master's auth code
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          STRESS_OUT: ${{ runner.temp }}/stress-master.json
        run: |
          git checkout origin/master -- src open-sse
          cd tests && ./node_modules/.bin/vitest run --config ./vitest.stress.config.js unit/auto-disable-stress.test.js
      - name: Results
        if: always()
        run: |
          echo "this branch:"; cat "$RUNNER_TEMP/stress-branch.json" || true
          echo; echo "master:"; cat "$RUNNER_TEMP/stress-master.json" 2>/dev/null || echo "(manual runs only)"
