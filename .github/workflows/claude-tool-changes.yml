name: Claude mid-conversation tool changes

on:
  pull_request:
    paths:
      - "open-sse/config/claudeMessageCompat.js"
      - "open-sse/utils/anthropicBeta.ts"
      - "open-sse/executors/base.js"
      - "open-sse/executors/default.js"
      - "open-sse/translator/**"
      - "open-sse/handlers/chatCore.js"
      - "tests/package.json"
      - "tests/vitest.config.js"
      - "tests/unit/claude-tool-changes.test.js"
      - "tests/unit/safeguards-field.test.js"
      - "tests/unit/beta-body-fields.test.js"
      - "tests/unit/translator-preview-finalize.test.js"
      - ".github/workflows/claude-tool-changes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Unit tests
        working-directory: tests
        run: >
          ./node_modules/.bin/vitest run
          unit/claude-tool-changes.test.js
          unit/safeguards-field.test.js
          unit/beta-body-fields.test.js
          unit/anthropic-beta-rejection.test.js
          unit/translator-preview-finalize.test.js
          unit/claude-foreign-server-tool-use.test.js
          unit/endpoint-overrides.test.js
      - name: Lint
        run: >
          ./node_modules/.bin/eslint
          open-sse/config/claudeMessageCompat.js
          open-sse/utils/anthropicBeta.ts
          open-sse/executors/base.js
          open-sse/executors/default.js
          open-sse/translator/concerns/toolChanges.js
          open-sse/translator/formats/claude.js
          open-sse/translator/index.ts
          open-sse/translator/schema/blocks.js
          open-sse/translator/schema/index.js
          tests/unit/claude-tool-changes.test.js
      # Fails only on errors in the .ts files this change touches, so unrelated
      # type errors elsewhere don't block it.
      - name: Type check anthropicBeta.ts and the translator entry
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit -p . > tsc.log 2>&1
          code=$?
          set -e
          tail -5 tsc.log
          if [ "$code" -gt 2 ] || ! [ -x ./node_modules/.bin/tsc ]; then echo "tsc did not run (exit $code)"; exit 1; fi
          if grep -F "open-sse/utils/anthropicBeta.ts" tsc.log; then exit 1; fi
          if grep -F "open-sse/translator/index.ts" tsc.log; then exit 1; fi

  # The suite is not all-green on master (see AGENTS.md), so this runs it on
  # both the base and this branch and fails only on tests that pass on the base
  # and fail here.
  no-new-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Check out the base branch next to this one
        run: git worktree add ../base "origin/${{ github.base_ref || 'master' }}"
      - name: Install dependencies (branch and base)
        run: |
          for dir in . ../base; do
            (cd "$dir" && bun install --ignore-scripts && cd tests && bun install --ignore-scripts)
          done
      - name: Run the suite on the base
        working-directory: ../base/tests
        # Each run gets its own HOME: tests without a DATA_DIR use ~/.9router,
        # and one run's database must not leak into the other.
        run: |
          mkdir -p "$RUNNER_TEMP/home-base"
          HOME="$RUNNER_TEMP/home-base" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/base.json" > /dev/null 2>&1 || true
      - name: Run the suite on this branch
        working-directory: tests
        run: |
          mkdir -p "$RUNNER_TEMP/home-head"
          HOME="$RUNNER_TEMP/home-head" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/head.json" > /dev/null 2>&1 || true
      - name: Compare
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const load = (file, root) => {
              const r = JSON.parse(readFileSync(file, "utf8"));
              const status = new Map();
              for (const f of r.testResults) {
                const rel = f.name.slice(f.name.indexOf("/tests/") + 1);
                for (const a of f.assertionResults) status.set(`${rel} :: ${a.fullName}`, a.status);
                // A file that failed to load has no assertions; count it as one failure.
                if (!f.assertionResults.length && f.status === "failed") status.set(`${rel} :: (file failed to load)`, "failed");
              }
              return { status, total: r.numTotalTests, failed: r.numFailedTests };
            };
            const base = load(process.env.RUNNER_TEMP + "/base.json");
            const head = load(process.env.RUNNER_TEMP + "/head.json");
            console.log(`base: ${base.failed}/${base.total} failed, head: ${head.failed}/${head.total} failed`);
            const regressions = [...head.status].filter(([k, s]) => s === "failed" && base.status.get(k) === "passed").map(([k]) => k);
            const fixed = [...base.status].filter(([k, s]) => s === "failed" && head.status.get(k) === "passed").map(([k]) => k);
            const newFailing = [...head.status].filter(([k, s]) => s === "failed" && !base.status.has(k)).map(([k]) => k);
            if (fixed.length) console.log("Now passing:\n  " + fixed.join("\n  "));
            if (newFailing.length) console.log("New tests failing:\n  " + newFailing.join("\n  "));
            if (regressions.length) console.log("Passed on the base, fail here:\n  " + regressions.join("\n  "));
            if (regressions.length || newFailing.length) process.exit(1);
          '
