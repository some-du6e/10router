name: Rate-limit backoff

on:
  pull_request:
    paths:
      - "src/sse/services/auth.js"
      - "open-sse/services/accountFallback.js"
      - "open-sse/config/errorConfig.js"
      - "tests/unit/rate-limit-backoff-burst.test.js"
      - "tests/unit/all-locked-soonest-error.test.js"
      - "tests/unit/rate-limit-burst-benchmark.test.js"
      - ".github/workflows/rate-limit-backoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      # Every unit file that drives account selection or locks (auth.js / accountFallback.js).
      - name: Account lock tests
        working-directory: tests
        run: >
          ./node_modules/.bin/vitest run
          unit/rate-limit-backoff-burst.test.js
          unit/all-locked-soonest-error.test.js
          unit/account-failure-handler.test.js
          unit/auto-disable-dead-keys.test.js
          unit/github-monthly-usage-lock.test.js
          unit/limit-hold-integration.test.js
          unit/tts-stt-success-clears-account.test.js
          unit/fetch-success-clears-account.test.js
          unit/embedding-usage-persistence.test.js
          unit/gemini-native-endpoint.test.js
          unit/systemone-handler.test.js
          unit/xai-video-handler.test.js
          unit/beta-persistence.test.js
          unit/antigravity-quota-routing.test.js
          unit/auto-combo.test.js
          unit/codex-fast-capacity.test.js
          unit/compatible-endpoint-runtime.test.js
          unit/selection-lock-per-provider.test.js
          unit/soonest-reset.test.js
      - name: Rate-limit burst benchmark
        working-directory: tests
        run: ./node_modules/.bin/vitest run --config ./vitest.benchmark.config.js rate-limit-burst
