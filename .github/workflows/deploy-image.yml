name: Deploy image

# Builds the production image in CI, so the server never compiles it. The server
# deploys the `deploy` branch with Dockerfile.deploy, which only pulls the image
# pushed here for that commit, and `deploy` moves only after the image passed
# the gateway E2E and an anonymous pull. See DOCKER.md, "Master builds".
#
# A master run builds master as it is when the run starts, so re-running an old
# run or starting one by hand deploys the newest commit (a re-run stops instead
# if master has changed this file since). Runs go one at a time: a commit that
# lands mid-run waits, and of several waiting only the newest runs. Tags are
# written once. No layer cache: any job on master could write one.
on:
  push:
    branches: [master]
    paths:
      - "**"
      - "!docs/**"
      - "!gitbook/**"
      - "!tests/**"
      - "!**/*.md"
      - "THIRD_PARTY_NOTICES.md"
      - "!.github/**"
      - ".github/workflows/deploy-image.yml"
  pull_request:
    paths:
      - ".github/workflows/deploy-image.yml"
      - "Dockerfile.deploy"
  workflow_dispatch:

concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # move the deploy branch
      packages: write # push to GHCR
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PUBLISH == 'true' && 'master' || '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies (for the E2E seed)
        run: bun install --ignore-scripts
      - name: Image name
        run: |
          commit="$(git rev-parse HEAD)"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$commit" >> "$GITHUB_ENV"
      # A re-run keeps the workflow file it started with, so it must not build
      # a master whose copy of this file differs.
      - name: This run's workflow is master's
        if: env.PUBLISH == 'true'
        run: |
          [ "$GITHUB_WORKFLOW_SHA" = "$COMMIT" ] && exit 0
          git fetch -q --depth=1 origin "$GITHUB_WORKFLOW_SHA"
          git diff --quiet FETCH_HEAD HEAD -- .github/workflows/deploy-image.yml \
            || { echo "::error::master changed this workflow after this run started; start a new run on master"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          build-args: SOURCE_COMMIT=${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          provenance: false
          sbom: false
      - name: E2E (GATEWAY_MODE unset, then proxy)
        env:
          OUT_DIR: ${{ github.workspace }}/e2e-out
        run: |
          set -o pipefail
          bash .github/e2e/gateway/run.sh 2>&1 | tee e2e.txt
      # The docker driver resolves FROM from the local image store, and the
      # base's labels carry over. Without SOURCE_COMMIT the server's build must
      # stop rather than pull some other tag, so the ARG has no default.
      - name: Dockerfile.deploy resolves to this image
        run: |
          grep -qx 'ARG SOURCE_COMMIT' Dockerfile.deploy \
            || { echo "Dockerfile.deploy must declare SOURCE_COMMIT with no default"; exit 1; }
          docker buildx build --builder default --load -f Dockerfile.deploy \
            --build-arg SOURCE_COMMIT="$COMMIT" -t deploy-check .
          got="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' deploy-check)"
          [ "$got" = "$COMMIT" ] || { echo "Dockerfile.deploy built revision '$got', want $COMMIT"; exit 1; }
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        if: env.PUBLISH == 'true'
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE is already pushed, and tags are written once"
          else
            docker push "$IMAGE"
            echo "Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The server builds Dockerfile.deploy with `docker build --pull` and no
      # registry login, so the package has to be public.
      - name: The server can pull it
        if: env.PUBLISH == 'true'
        run: |
          docker logout ghcr.io
          docker buildx build --builder default --pull --load -f Dockerfile.deploy \
            --build-arg SOURCE_COMMIT="$COMMIT" -t deploy-pulled .
          got="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' deploy-pulled)"
          [ "$got" = "$COMMIT" ] || { echo "pulled revision '$got', want $COMMIT"; exit 1; }
      # Through the refs API, so GitHub refuses anything but a fast-forward.
      - name: Move deploy to this commit
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/deploy" --jq .object.sha 2> /dev/null || true)"
          if [ "$current" = "$COMMIT" ]; then
            echo "deploy is already at $COMMIT"
          elif [[ "$current" =~ ^[0-9a-f]{40}$ ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/deploy" -f sha="$COMMIT" -F force=false > /dev/null
            echo "deploy: $current -> $COMMIT"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/deploy -f sha="$COMMIT" > /dev/null
            echo "deploy created at $COMMIT"
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            grep -E '^(PASS|FAIL)' e2e.txt 2> /dev/null | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-image-e2e
          path: |
            e2e.txt
            e2e-out/*.json
            e2e-out/*.log
            e2e-out/*.ps
            e2e-out/*.norm
            e2e-out/*.raw
            e2e-out/*.dashboard
