name: Deploy image

# Builds the production image in CI, so the server never compiles it. The server
# deploys the `deploy` branch with Dockerfile.deploy, which only pulls the image
# pushed here for that commit, and `deploy` moves only after the image passed
# the gateway E2E and an anonymous pull. See DOCKER.md, "Master builds".
#
# The write token never shares a runner with dependency code. `build` compiles
# inside BuildKit and hashes the image; `e2e` runs the E2E, and with it the
# seed's dependencies, on a read-only token; only `publish` can write, and it
# runs no repository code: it pushes the tarball `build` hashed, then moves
# `deploy`. No layer cache, since any job on master could write one.
#
# A master run builds master as it is when the run starts, so starting one by
# hand, or re-running all jobs of an old one, deploys the newest commit (a
# re-run stops instead if master has changed this file since). Re-running only
# the failed jobs publishes that run's own build, while its one-day artifact
# lasts, and does nothing once deploy is past it. Runs go one at a time: a
# commit that lands mid-run waits, and of several waiting only the newest runs.
on:
  push:
    branches: [master]
    paths:
      - "**"
      - "!docs/**"
      - "!gitbook/**"
      - "!tests/**"
      - "!**/*.md"
      - "THIRD_PARTY_NOTICES.md"
      - "!.github/**"
      - ".github/workflows/deploy-image.yml"
  pull_request:
    paths:
      - ".github/workflows/deploy-image.yml"
      - "Dockerfile.deploy"
  workflow_dispatch:

concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.name.outputs.commit }}
      image: ${{ steps.name.outputs.image }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.PUBLISH == 'true' && 'master' || '' }}
          persist-credentials: false
      - name: Image name
        id: name
        run: |
          commit="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      # A re-run keeps the workflow file it started with, so it must not build
      # a master whose copy of this file differs.
      - name: This run's workflow is master's
        if: env.PUBLISH == 'true'
        run: |
          [ "$GITHUB_WORKFLOW_SHA" = "$COMMIT" ] && exit 0
          git fetch -q --depth=1 origin "$GITHUB_WORKFLOW_SHA"
          git diff --quiet FETCH_HEAD HEAD -- .github/workflows/deploy-image.yml \
            || { echo "::error::master changed this workflow after this run started; start a new run on master"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          build-args: SOURCE_COMMIT=${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          provenance: false
          sbom: false
      - name: Hash the image
        id: hash
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/image.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 1

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          no-cache: true
      - name: Install dependencies (for the E2E seed)
        run: bun install --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load -i "$RUNNER_TEMP/image.tar"
      - name: E2E (GATEWAY_MODE unset, then proxy)
        env:
          OUT_DIR: ${{ github.workspace }}/e2e-out
        run: |
          set -o pipefail
          bash .github/e2e/gateway/run.sh 2>&1 | tee e2e.txt
      # The docker driver resolves FROM from the local image store, and the
      # base's labels carry over. Without SOURCE_COMMIT the server's build must
      # stop rather than pull some other tag, so the ARG has no default.
      - name: Dockerfile.deploy resolves to this image
        run: |
          grep -qx 'ARG SOURCE_COMMIT' Dockerfile.deploy \
            || { echo "Dockerfile.deploy must declare SOURCE_COMMIT with no default"; exit 1; }
          docker buildx build --builder default --load -f Dockerfile.deploy \
            --build-arg SOURCE_COMMIT="$COMMIT" -t deploy-check .
          got="$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' deploy-check)"
          [ "$got" = "$COMMIT" ] || { echo "Dockerfile.deploy built revision '$got', want $COMMIT"; exit 1; }
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            grep -E '^(PASS|FAIL)' e2e.txt 2> /dev/null | head -100
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deploy-image-e2e
          path: |
            e2e.txt
            e2e-out/*.json
            e2e-out/*.log
            e2e-out/*.ps
            e2e-out/*.norm
            e2e-out/*.raw
            e2e-out/*.dashboard

  publish:
    needs: [build, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # move the deploy branch
      packages: write # push to GHCR
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      COMMIT: ${{ needs.build.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # When deploy already includes this commit (this run's head, or an older
      # run's on a re-run of its failed jobs), pushing would only swap the
      # image under a tag production may run. Only a 404 means no deploy yet.
      - name: Where deploy is
        id: deploy
        run: |
          if current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/deploy" --jq .object.sha 2> "$RUNNER_TEMP/deploy.err")"; then
            todo=true
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...$current" --jq .status)"
            case "$status" in
              identical | ahead)
                todo=false
                echo "deploy ($current) already includes $COMMIT, so there is nothing to publish"
                ;;
            esac
          elif grep -q '(HTTP 404)' "$RUNNER_TEMP/deploy.err"; then
            current=""
            todo=true
          else
            cat "$RUNNER_TEMP/deploy.err"
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.deploy.outputs.todo == 'true'
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image build hashed
        if: steps.deploy.outputs.todo == 'true'
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "$SHA256  $RUNNER_TEMP/image.tar" | sha256sum -c -
          docker load -i "$RUNNER_TEMP/image.tar"
      - name: Log in to GHCR
        if: steps.deploy.outputs.todo == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image
        if: steps.deploy.outputs.todo == 'true'
        run: |
          docker push "$IMAGE"
          echo "Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
      # The server pulls with no registry login, so the package has to be
      # public. `docker pull` always resolves the tag at the registry.
      - name: The server can pull it
        if: steps.deploy.outputs.todo == 'true'
        run: |
          docker logout ghcr.io
          docker pull "$IMAGE"
      # Through the refs API, so GitHub refuses anything but a fast-forward.
      - name: Move deploy to this commit
        if: steps.deploy.outputs.todo == 'true'
        env:
          CURRENT: ${{ steps.deploy.outputs.current }}
        run: |
          if [ -n "$CURRENT" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/deploy" -f sha="$COMMIT" -F force=false > /dev/null
            echo "deploy: $CURRENT -> $COMMIT"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/deploy -f sha="$COMMIT" > /dev/null
            echo "deploy created at $COMMIT"
          fi
