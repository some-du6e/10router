name: Stream early headers E2E

# A mock upstream that holds its response headers for 150s, behind a real
# Cloudflare quick tunnel. master is expected to 524; this branch to answer.
on:
  pull_request:
    paths:
      - "open-sse/utils/earlyHeaders.js"
      - "src/sse/handlers/chat.ts"
      - "open-sse/handlers/chatCore.js"
      - ".github/e2e/early-headers/**"
      - ".github/workflows/stream-early-headers-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        leg: [master, pr]
    steps:
      - name: Check out the harness
        uses: actions/checkout@v5
        with:
          path: harness
      - name: Check out the app (${{ matrix.leg }})
        uses: actions/checkout@v5
        with:
          path: app
          ref: ${{ matrix.leg == 'master' && 'master' || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: app
        run: bun install --ignore-scripts
      - name: Build
        working-directory: app
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Install cloudflared and Claude Code
        run: |
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          npm install -g @anthropic-ai/claude-code
          cloudflared --version
          claude --version
      - name: E2E (${{ matrix.leg }})
        working-directory: app
        env:
          OUT_DIR: ${{ github.workspace }}/e2e-out
        run: |
          set -o pipefail
          bash ../harness/.github/e2e/early-headers/run.sh ${{ matrix.leg }} 2>&1 | tee ../e2e-${{ matrix.leg }}.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.leg }}"
            echo '```'
            grep -vE '^::(end)?group::' e2e-${{ matrix.leg }}.txt | head -300
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.leg }}
          path: |
            e2e-out/*.log
            e2e-out/*.body
            e2e-out/*.out
            e2e-out/*.meta
            e2e-${{ matrix.leg }}.txt
