name: Dashboard key status

on:
  pull_request:
    paths:
      - "src/shared/utils/connectionStatus.js"
      - "src/app/(dashboard)/dashboard/providers/*/ConnectionRow.js"
      - "src/app/(dashboard)/dashboard/providers/*/CustomEndpointPage.tsx"
      - "src/app/(dashboard)/dashboard/providers/components/ConnectionsCard.js"
      - "src/app/(dashboard)/dashboard/providers/utils.js"
      - "src/lib/db/repos/connectionsRepo.js"
      - "src/sse/services/auth.js"
      - "tests/unit/demoted-label.test.js"
      - ".github/workflows/dashboard-key-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Unit test
        working-directory: tests
        run: ./node_modules/.bin/vitest run unit/demoted-label.test.js unit/auto-disable-dead-keys.test.js
      # set-state-in-effect: ConnectionsCard.js's data-loading effect, which
      # predates this check (it fails on master too).
      - name: Lint
        run: >
          ./node_modules/.bin/eslint --rule 'react-hooks/set-state-in-effect: off'
          src/shared/utils/connectionStatus.js
          "src/app/(dashboard)/dashboard/providers/[id]/ConnectionRow.js"
          "src/app/(dashboard)/dashboard/providers/[id]/CustomEndpointPage.tsx"
          "src/app/(dashboard)/dashboard/providers/components/ConnectionsCard.js"
          "src/app/(dashboard)/dashboard/providers/utils.js"
          src/lib/db/repos/connectionsRepo.js
          tests/unit/demoted-label.test.js
      # Fails only on errors in the changed .tsx file, so unrelated type errors
      # elsewhere don't block it.
      - name: Type check CustomEndpointPage.tsx
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit -p . > tsc.log 2>&1
          code=$?
          set -e
          tail -5 tsc.log
          if [ "$code" -gt 2 ] || ! [ -x ./node_modules/.bin/tsc ]; then echo "tsc did not run (exit $code)"; exit 1; fi
          if grep -F "providers/[id]/CustomEndpointPage.tsx" tsc.log; then exit 1; fi
