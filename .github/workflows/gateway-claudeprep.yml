name: Gateway claudeprep parity

# The Go port of Node's Claude request preparation
# (gateway/internal/claudeprep, docs/GO_GATEWAY.md "Parity testing"):
#   parity           this PR's Node records the large corpus, then the Go
#                    parity test must reproduce every body byte for byte
#                    (and the committed fixtures must still be what Node makes)
#   no-new-failures  the whole vitest suite, base vs this branch
on:
  pull_request:
    paths:
      - "gateway/internal/claudeprep/**"
      - "gateway/node-map.json"
      - "tests/helpers/claudeprepCorpus.js"
      - "tests/unit/gateway-claudeprep-parity.test.js"
      - "tests/unit/gateway-catalog-parity.test.js"
      - ".github/workflows/gateway-claudeprep.yml"
      - "open-sse/providers/catalogOverride.js"
      - "src/lib/dataDir.js"
      - "open-sse/translator/**"
      - "open-sse/services/provider.js"
      - "open-sse/config/providerModels.js"
      - "open-sse/config/claudeMessageCompat.js"
      - "open-sse/providers/capabilities.js"
      - "open-sse/providers/thinkingLevels.js"
      - "open-sse/providers/visionPatterns.js"
      - "open-sse/handlers/chatCore.js"
      - "open-sse/handlers/chatCore/endpointOverrides.ts"
      - "open-sse/executors/default.js"
      - "open-sse/executors/base.js"
      - "open-sse/utils/**"
      - "src/shared/utils/endpointOverrides.ts"
      - "src/shared/utils/nodeQuirks.ts"
      - "src/sse/handlers/chat.ts"
      - "src/sse/utils/requestBody.js"
      # Constants and tables the Go port embeds through tables.json.
      - "open-sse/providers/shared.js"
      - "open-sse/providers/registry/openai.js"
      - "open-sse/config/runtimeConfig.js"
      - "open-sse/config/appConstants.js"
      - "open-sse/config/providers.js"
      - "open-sse/providers/index.js"
      - "open-sse/providers/pricing.js"
      - "open-sse/executors/index.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache: false
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Node still makes the committed fixtures and table export
        working-directory: tests
        run: ./node_modules/.bin/vitest run unit/gateway-claudeprep-parity.test.js unit/gateway-catalog-parity.test.js
      - name: Record the large corpus with this PR's Node
        working-directory: tests
        env:
          CLAUDEPREP_RECORD: "1"
          CLAUDEPREP_LARGE: "1"
          CLAUDEPREP_OUT: ${{ runner.temp }}/claudeprep-fixtures
        run: |
          ./node_modules/.bin/vitest run unit/gateway-claudeprep-parity.test.js
          du -sh "$CLAUDEPREP_OUT"
          # The Go test must load every fixture: the committed ones and these.
          total=$(( $(ls "$CLAUDEPREP_OUT" | wc -l) + $(ls ../gateway/internal/claudeprep/testdata/fixtures | wc -l) ))
          echo "CLAUDEPREP_MIN_FIXTURES=$total" >> "$GITHUB_ENV"
          echo "fixtures: $total"
      - name: Go parity test (committed + large corpus)
        working-directory: gateway
        env:
          CLAUDEPREP_FIXTURES: ${{ runner.temp }}/claudeprep-fixtures
          CLAUDEPREP_REPORT: ${{ runner.temp }}/claudeprep-report.txt
        run: go test -count=1 -v ./internal/claudeprep 2>&1 | tee "$RUNNER_TEMP/claudeprep-go.txt" | grep -a -v -E '^\s+--- PASS|^=== RUN' ; exit "${PIPESTATUS[0]}"
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/claudeprep-report.txt" 2>/dev/null || echo "no report"
            grep -a -E -- '--- FAIL' "$RUNNER_TEMP/claudeprep-go.txt" 2>/dev/null | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: claudeprep-parity
          path: |
            ${{ runner.temp }}/claudeprep-go.txt
            ${{ runner.temp }}/claudeprep-fixtures

  # The suite is not all-green on master (see AGENTS.md), so this runs it on
  # both the base and this branch and fails only on tests that pass on the base
  # and fail here (same job as api-key-budgets.yml).
  no-new-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Check out the base branch next to this one
        run: git worktree add ../base "origin/${{ github.base_ref || 'master' }}"
      - name: Install dependencies (branch and base)
        run: |
          for dir in . ../base; do
            (cd "$dir" && bun install --ignore-scripts && cd tests && bun install --ignore-scripts)
          done
      - name: Run the suite on the base
        working-directory: ../base/tests
        # Each run gets its own HOME: tests without a DATA_DIR use ~/.9router,
        # and one run's database must not leak into the other.
        run: |
          mkdir -p "$RUNNER_TEMP/home-base"
          HOME="$RUNNER_TEMP/home-base" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/base.json" > /dev/null 2>&1 || true
      - name: Run the suite on this branch
        working-directory: tests
        run: |
          mkdir -p "$RUNNER_TEMP/home-head"
          HOME="$RUNNER_TEMP/home-head" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/head.json" > /dev/null 2>&1 || true
      - name: Compare
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const load = (file) => {
              const r = JSON.parse(readFileSync(file, "utf8"));
              const status = new Map();
              for (const f of r.testResults) {
                const rel = f.name.slice(f.name.indexOf("/tests/") + 1);
                for (const a of f.assertionResults) status.set(`${rel} :: ${a.fullName}`, a.status);
                // A file that failed to load has no assertions; count it as one failure.
                if (!f.assertionResults.length && f.status === "failed") status.set(`${rel} :: (file failed to load)`, "failed");
              }
              return { status, total: r.numTotalTests, failed: r.numFailedTests };
            };
            const base = load(process.env.RUNNER_TEMP + "/base.json");
            const head = load(process.env.RUNNER_TEMP + "/head.json");
            console.log(`base: ${base.failed}/${base.total} failed, head: ${head.failed}/${head.total} failed`);
            const regressions = [...head.status].filter(([k, s]) => s === "failed" && base.status.get(k) === "passed").map(([k]) => k);
            const fixed = [...base.status].filter(([k, s]) => s === "failed" && head.status.get(k) === "passed").map(([k]) => k);
            const newFailing = [...head.status].filter(([k, s]) => s === "failed" && !base.status.has(k)).map(([k]) => k);
            if (fixed.length) console.log("Now passing:\n  " + fixed.join("\n  "));
            if (newFailing.length) console.log("New tests failing:\n  " + newFailing.join("\n  "));
            if (regressions.length) console.log("Passed on the base, fail here:\n  " + regressions.join("\n  "));
            if (regressions.length || newFailing.length) process.exit(1);
          '
