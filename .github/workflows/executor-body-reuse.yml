name: Executor body reuse

on:
  pull_request:
    paths:
      - "open-sse/executors/base.js"
      - "src/shared/utils/jsonBytes.ts"
      - "open-sse/executors/default.js"
      - "open-sse/executors/kiro.js"
      - "open-sse/executors/ollama-local.js"
      - "open-sse/executors/xiaomi-tokenplan.js"
      - "open-sse/services/provider.js"
      - "open-sse/handlers/chatCore.js"
      - "src/sse/handlers/chat.ts"
      - "open-sse/handlers/chatCore/endpointOverrides.ts"
      - "open-sse/utils/anthropicBeta.ts"
      - "tests/package.json"
      - "tests/vitest.config.js"
      - "tests/vitest.shared.js"
      - "tests/unit/executor-body-reuse.test.js"
      - ".github/workflows/executor-body-reuse.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      # The new test, plus the ones that pin what a resend must still change:
      # beta retries, refresh retries, endpoint overrides, retry/fallback order.
      - name: Unit tests
        working-directory: tests
        run: >
          ./node_modules/.bin/vitest run
          unit/executor-body-reuse.test.js
          unit/base-executor-retry.test.js
          unit/anthropic-beta-rejection.test.js
          unit/beta-body-fields.test.js
          unit/safeguards-field.test.js
          unit/endpoint-overrides.test.js
          unit/refresh-retry-credentials.test.js
          unit/chat-core-failure-detail.test.js
      - name: Lint
        run: >
          ./node_modules/.bin/eslint
          open-sse/executors/base.js
          open-sse/executors/default.js
          open-sse/executors/kiro.js
          open-sse/handlers/chatCore.js
          tests/unit/executor-body-reuse.test.js

  # Informational, for the PR's "Before": this branch's test against the base
  # branch's code. Every source file under open-sse/ that this branch modifies
  # is checked out from the base; the tests stay. Reports what fails and why;
  # test failures there don't fail the run.
  before-on-base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: |
          bun install --ignore-scripts
          cd tests && bun install --ignore-scripts
      - name: Check out the base branch's code for the changed source files
        run: |
          base="origin/${{ github.base_ref || 'master' }}"
          changed=$(git diff --name-only --diff-filter=M "$base"...HEAD -- open-sse)
          if [ -z "$changed" ]; then echo "No source files changed from $base; nothing to compare."; exit 0; fi
          echo "$changed"
          git checkout "$base" -- $changed
          echo "compare=yes" >> "$GITHUB_ENV"
      - name: Run this branch's test on it (informational)
        if: env.compare == 'yes'
        working-directory: tests
        run: |
          status=0
          ./node_modules/.bin/vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/before.json" \
            unit/executor-body-reuse.test.js || status=$?
          VITEST_STATUS="$status" node --input-type=module -e '
            import { existsSync, readFileSync, appendFileSync } from "node:fs";
            const file = process.env.RUNNER_TEMP + "/before.json";
            const exited = `vitest exited ${process.env.VITEST_STATUS}`;
            let r = null;
            try { if (existsSync(file)) r = JSON.parse(readFileSync(file, "utf8")); } catch { r = null; }
            if (!r) {
              const line = `Informational. Before: ${exited} without a readable report.`;
              console.log(line);
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + "\n");
              process.exit(0);
            }
            const lines = [`Informational. Before (base code, this branch tests): ${r.numFailedTests} failed, ${r.numPassedTests} passed of ${r.numTotalTests}; ${exited}`];
            for (const f of r.testResults) {
              const rel = f.name.slice(f.name.indexOf("/tests/") + 1);
              if (!f.assertionResults.length && f.status === "failed") lines.push(`  ${rel}: failed to load`);
              for (const a of f.assertionResults) {
                if (a.status !== "failed") continue;
                lines.push(`  ${rel} :: ${a.fullName}`);
                const why = (a.failureMessages || [])[0]?.split("\n")[0];
                if (why) lines.push(`    ${why}`);
              }
            }
            console.log(lines.join("\n"));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, "```\n" + lines.join("\n") + "\n```\n");
          '

  # The suite is not all-green on master (see AGENTS.md), so this runs it on
  # both the base and this branch and fails only on tests that pass on the base
  # and fail here.
  no-new-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Check out the base branch next to this one
        run: git worktree add ../base "origin/${{ github.base_ref || 'master' }}"
      - name: Install dependencies (branch and base)
        run: |
          for dir in . ../base; do
            (cd "$dir" && bun install --ignore-scripts && cd tests && bun install --ignore-scripts)
          done
      - name: Run the suite on the base
        working-directory: ../base/tests
        # Each run gets its own HOME: tests without a DATA_DIR use ~/.9router,
        # and one run's database must not leak into the other.
        run: |
          mkdir -p "$RUNNER_TEMP/home-base"
          HOME="$RUNNER_TEMP/home-base" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/base.json" > /dev/null 2>&1 || true
      - name: Run the suite on this branch
        working-directory: tests
        run: |
          mkdir -p "$RUNNER_TEMP/home-head"
          HOME="$RUNNER_TEMP/home-head" ./node_modules/.bin/vitest run --reporter=json --outputFile="$RUNNER_TEMP/head.json" > /dev/null 2>&1 || true
      - name: Compare
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const load = (file) => {
              const r = JSON.parse(readFileSync(file, "utf8"));
              const status = new Map();
              for (const f of r.testResults) {
                const rel = f.name.slice(f.name.indexOf("/tests/") + 1);
                for (const a of f.assertionResults) status.set(`${rel} :: ${a.fullName}`, a.status);
                // A file that failed to load has no assertions; count it as one failure.
                if (!f.assertionResults.length && f.status === "failed") status.set(`${rel} :: (file failed to load)`, "failed");
              }
              return { status, total: r.numTotalTests, failed: r.numFailedTests };
            };
            const base = load(process.env.RUNNER_TEMP + "/base.json");
            const head = load(process.env.RUNNER_TEMP + "/head.json");
            console.log(`base: ${base.failed}/${base.total} failed, head: ${head.failed}/${head.total} failed`);
            const regressions = [...head.status].filter(([k, s]) => s === "failed" && base.status.get(k) === "passed").map(([k]) => k);
            const fixed = [...base.status].filter(([k, s]) => s === "failed" && head.status.get(k) === "passed").map(([k]) => k);
            const newFailing = [...head.status].filter(([k, s]) => s === "failed" && !base.status.has(k)).map(([k]) => k);
            if (fixed.length) console.log("Now passing:\n  " + fixed.join("\n  "));
            if (newFailing.length) console.log("New tests failing:\n  " + newFailing.join("\n  "));
            if (regressions.length) console.log("Passed on the base, fail here:\n  " + regressions.join("\n  "));
            if (regressions.length || newFailing.length) process.exit(1);
          '
